name: Verify site
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Static and interaction tests
        run: node --test tests/site.test.mjs
      - name: Install lightweight browser test driver
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24
      - name: Real Chrome phone and desktop checks
        run: node tests/browser-smoke.mjs
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-browser-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: ignore
          retention-days: 7
